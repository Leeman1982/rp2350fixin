; PlatformIO Configuration for RP2350 Professional Synthesizer
; 
; Build configurations:
;   [env:pico2]        - Standard build @ 150MHz
;   [env:pico2_fast]   - Optimized build @ 200MHz overclock
;   [env:pico2_debug]  - Debug build with serial output

[platformio]
default_envs = pico2_fast
src_dir = .
include_dir = .

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
monitor_speed = 115200

; Common build flags for audio optimization
build_flags_common = 
    -DPICO_AUDIO_I2S_MONO_INPUT=0
    -DPICO_AUDIO_I2S_MONO_OUTPUT=0
    -DUSE_TINYUSB=0
    ; Math optimizations
    -ffast-math
    -fno-math-errno
    -funsafe-math-optimizations
    -ffinite-math-only
    -fno-trapping-math
    ; Code size/speed optimizations
    -ffunction-sections
    -fdata-sections
    ; ARM Cortex-M33 specific
    -mcpu=cortex-m33
    -mthumb
    -mfloat-abi=hard
    -mfpu=fpv5-sp-d16

lib_deps_common = 
    MIDI Library@^5.0.2
    https://github.com/pschatzmann/arduino-audio-tools.git

; ===== STANDARD BUILD =====
[env:pico2]
extends = common
build_flags = 
    ${common.build_flags_common}
    -O2
    -DSYNTH_SAMPLE_RATE=48000
    -DSYNTH_VOICES=8
lib_deps = ${common.lib_deps_common}

; ===== FAST BUILD (200MHz overclock) =====
[env:pico2_fast]
extends = common
build_flags = 
    ${common.build_flags_common}
    -O3
    -DPICO_FLASH_SPI_CLKDIV=2
    -DF_CPU=200000000L
    -DSYNTH_SAMPLE_RATE=48000
    -DSYNTH_VOICES=8
    -DSYNTH_OVERCLOCK=1
    ; Aggressive loop optimizations
    -funroll-loops
    -ftree-vectorize
lib_deps = ${common.lib_deps_common}
board_build.f_cpu = 200000000L

; ===== DEBUG BUILD =====
[env:pico2_debug]
extends = common
build_flags = 
    ${common.build_flags_common}
    -Og
    -g3
    -DDEBUG=1
    -DSYNTH_DEBUG=1
    -DSYNTH_SAMPLE_RATE=48000
    -DSYNTH_VOICES=6
lib_deps = ${common.lib_deps_common}
build_type = debug

; ===== MINIMAL BUILD (for testing) =====
[env:pico2_minimal]
extends = common
build_flags = 
    ${common.build_flags_common}
    -Os
    -DSYNTH_SAMPLE_RATE=48000
    -DSYNTH_VOICES=4
    -DSYNTH_MINIMAL=1
lib_deps = ${common.lib_deps_common}
